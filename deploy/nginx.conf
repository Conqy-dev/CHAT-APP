# nginx = the public entry point. Browsers connect to port 80 here;
# nginx forwards each request to uvicorn listening privately on 127.0.0.1:8000.

# If the browser asked to upgrade to a WebSocket, keep the connection open ("upgrade"),
# otherwise close it normally after the response.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;                            # WebSocket upgrade requires HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;            # pass "Upgrade: websocket" through
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;                  # the app compares Host with Origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;                             # default 60 s would cut idle chat sockets
        proxy_send_timeout 1h;
    }
}
