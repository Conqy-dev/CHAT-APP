<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">ConqChat: Cloud Deployment Architecture (Microsoft Azure)</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#555">TCP connection paths from clients on the Internet to processes on the virtual machine</text>

  <!-- Internet clients -->
  <rect x="20" y="90" width="230" height="640" rx="12" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="135" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#424242">INTERNET</text>

  <rect x="40" y="150" width="190" height="95" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="135" y="180" text-anchor="middle" font-size="15" font-weight="bold">Browser users</text>
  <text x="135" y="202" text-anchor="middle" font-size="13">http://&lt;public-ip&gt;</text>
  <text x="135" y="222" text-anchor="middle" font-size="12" fill="#555">HTTP + WebSocket</text>

  <rect x="40" y="320" width="190" height="95" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="135" y="350" text-anchor="middle" font-size="15" font-weight="bold">Terminal users</text>
  <text x="135" y="372" text-anchor="middle" font-size="13">chat_client.py</text>
  <text x="135" y="392" text-anchor="middle" font-size="12" fill="#555">--host &lt;ip&gt; --port 5000</text>

  <rect x="40" y="520" width="190" height="95" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="135" y="550" text-anchor="middle" font-size="15" font-weight="bold">Administrator</text>
  <text x="135" y="572" text-anchor="middle" font-size="13">az CLI + SSH (key only)</text>
  <text x="135" y="592" text-anchor="middle" font-size="12" fill="#555">from one public IP</text>

  <!-- Azure boundary -->
  <rect x="290" y="90" width="890" height="640" rx="14" fill="#f0f7ff" stroke="#0078d4" stroke-width="2.5"/>
  <text x="310" y="118" font-size="17" font-weight="bold" fill="#0063b1">Microsoft Azure · Resource group conqchat-rg · Region: UK South</text>

  <!-- Public IP -->
  <rect x="320" y="290" width="140" height="150" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="2"/>
  <text x="390" y="320" text-anchor="middle" font-size="14" font-weight="bold">Public IP</text>
  <text x="390" y="340" text-anchor="middle" font-size="13">(Standard,</text>
  <text x="390" y="358" text-anchor="middle" font-size="13">static IPv4)</text>
  <text x="390" y="385" text-anchor="middle" font-size="12" fill="#555">network</text>
  <text x="390" y="401" text-anchor="middle" font-size="12" fill="#555">entry point</text>

  <!-- NSG -->
  <rect x="490" y="140" width="170" height="560" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.2"/>
  <text x="575" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">Network Security</text>
  <text x="575" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">Group (firewall)</text>
  <text x="575" y="215" text-anchor="middle" font-size="12" fill="#555">inbound rules</text>
  <rect x="505" y="230" width="140" height="58" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="575" y="254" text-anchor="middle" font-size="13" font-weight="bold">ALLOW TCP 80</text>
  <text x="575" y="274" text-anchor="middle" font-size="12">from Internet</text>
  <rect x="505" y="345" width="140" height="58" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="575" y="369" text-anchor="middle" font-size="13" font-weight="bold">ALLOW TCP 5000</text>
  <text x="575" y="389" text-anchor="middle" font-size="12">from Internet</text>
  <rect x="505" y="540" width="140" height="58" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="575" y="564" text-anchor="middle" font-size="13" font-weight="bold">ALLOW TCP 22</text>
  <text x="575" y="584" text-anchor="middle" font-size="12">from admin IP/32</text>
  <rect x="505" y="625" width="140" height="58" rx="6" fill="#ffffff" stroke="#c62828"/>
  <text x="575" y="649" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">DENY all other</text>
  <text x="575" y="669" text-anchor="middle" font-size="12">(8000, 5432, …)</text>

  <!-- VM -->
  <rect x="700" y="140" width="460" height="560" rx="12" fill="#ffffff" stroke="#0078d4" stroke-width="2.2"/>
  <text x="930" y="168" text-anchor="middle" font-size="16" font-weight="bold" fill="#0063b1">Azure Virtual Machine conqchat-vm</text>
  <text x="930" y="188" text-anchor="middle" font-size="13" fill="#555">Ubuntu 24.04 LTS · Standard_B1s (1 vCPU, 1 GiB) · systemd</text>

  <rect x="725" y="215" width="190" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="820" y="243" text-anchor="middle" font-size="15" font-weight="bold">nginx</text>
  <text x="820" y="265" text-anchor="middle" font-size="13">listens 0.0.0.0:80</text>
  <text x="820" y="285" text-anchor="middle" font-size="12" fill="#555">reverse proxy, WS Upgrade</text>

  <rect x="945" y="215" width="195" height="290" rx="8" fill="#f5f7ff" stroke="#3949ab" stroke-width="2"/>
  <text x="1042" y="243" text-anchor="middle" font-size="15" font-weight="bold">ConqChat process</text>
  <text x="1042" y="263" text-anchor="middle" font-size="12" fill="#555">(uvicorn, systemd service)</text>
  <rect x="960" y="280" width="165" height="70" rx="6" fill="#ffffff" stroke="#3949ab"/>
  <text x="1042" y="305" text-anchor="middle" font-size="13" font-weight="bold">HTTP + WebSocket</text>
  <text x="1042" y="325" text-anchor="middle" font-size="12">127.0.0.1:8000</text>
  <rect x="960" y="365" width="165" height="70" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8"/>
  <text x="1042" y="390" text-anchor="middle" font-size="13" font-weight="bold">TCP chat server</text>
  <text x="1042" y="410" text-anchor="middle" font-size="12">0.0.0.0:5000 (NDJSON)</text>
  <text x="1042" y="470" text-anchor="middle" font-size="12" fill="#555">.env: secrets (chmod 600)</text>
  <text x="1042" y="488" text-anchor="middle" font-size="12" fill="#555">logs/server.log</text>

  <rect x="945" y="545" width="195" height="80" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="1.8"/>
  <text x="1042" y="575" text-anchor="middle" font-size="15" font-weight="bold">PostgreSQL</text>
  <text x="1042" y="597" text-anchor="middle" font-size="12">127.0.0.1:5432</text>

  <rect x="725" y="540" width="190" height="90" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.8"/>
  <text x="820" y="568" text-anchor="middle" font-size="15" font-weight="bold">sshd</text>
  <text x="820" y="590" text-anchor="middle" font-size="13">listens 0.0.0.0:22</text>
  <text x="820" y="610" text-anchor="middle" font-size="12" fill="#555">tcpdump, tc netem, logs</text>

  <!-- Paths -->
  <line x1="230" y1="197" x2="318" y2="320" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#ag)"/>
  <text x="250" y="270" font-size="12" fill="#2e7d32">TCP :80</text>
  <line x1="230" y1="367" x2="318" y2="367" stroke="#e65100" stroke-width="2.4" marker-end="url(#ao)"/>
  <text x="248" y="358" font-size="12" fill="#e65100">TCP :5000</text>
  <line x1="230" y1="567" x2="318" y2="415" stroke="#5e35b1" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="250" y="505" font-size="12" fill="#5e35b1">TCP :22</text>

  <line x1="460" y1="320" x2="503" y2="262" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="460" y1="370" x2="503" y2="372" stroke="#e65100" stroke-width="2.2" marker-end="url(#ao)"/>
  <line x1="460" y1="420" x2="503" y2="565" stroke="#5e35b1" stroke-width="2" marker-end="url(#a)"/>

  <line x1="645" y1="259" x2="723" y2="259" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#ag)"/>
  <line x1="645" y1="374" x2="958" y2="398" stroke="#e65100" stroke-width="2.4" marker-end="url(#ao)"/>
  <text x="760" y="372" font-size="12" fill="#e65100">direct, no proxy</text>
  <line x1="645" y1="569" x2="723" y2="580" stroke="#5e35b1" stroke-width="2" marker-end="url(#a)"/>

  <line x1="915" y1="262" x2="958" y2="308" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="895" y="322" font-size="11" fill="#2e7d32">TCP 127.0.0.1:8000</text>
  <line x1="1042" y1="505" x2="1042" y2="543" stroke="#ad1457" stroke-width="2.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="1050" y="528" font-size="11" fill="#ad1457">TCP :5432</text>
</svg>
